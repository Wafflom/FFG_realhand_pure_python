[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "realhand-pure-python-teleop"
version = "0.2.0"
description = "Glove teleoperation for RealHand dexterous robot hands, with a desktop GUI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pyserial",
    "PyYAML",
    "python-can",
]

[tool.setuptools.packages.find]
include = ["realhand_pure_python*"]

[tool.setuptools.package-data]
realhand_pure_python = [
    "config/*.yml",
    "assets/robots/hands/real_hand/*/*.urdf",
]
